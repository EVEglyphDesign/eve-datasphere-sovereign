table: EFFCAT
module: EXT
description: Effect category master — the taxonomy of societal effects a ledger line may carry. Held as
  master data rather than hard-coded so a community can extend its own vocabulary without a schema change,
  the same way an operating concern extends CO-PA.
source: EVEglyphDesign extension. Categories map outward to published reporting standards via EFFSTD.
