table: MEMBR
module: EXT
description: 'Member organisation registry. The professional community this model exists to serve: the
  firms, parishes, councils, schools and non-profits that post effects, verify each other''s claims and
  hold recognition. Membership carries a peer group and a standing, because the point of the register
  is that an organisation which accomplished something can be told apart from one that described something.'
source: 'EVEglyphDesign extension. Consent-scoped: a member controls the visibility of its own record.'
