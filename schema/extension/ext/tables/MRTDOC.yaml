table: MRTDOC
module: EXT
description: Recognition ledger. Units minted against verified effect lines, held by member organisations
  and spent on standing within the community. It is a ledger in its own right, double-sided and reversible,
  because a recognition that cannot be audited is a marketing claim. Minting requires a verified ACDOCX
  line behind it; nothing is minted from an intention.
source: EVEglyphDesign extension. Community-minted recognition, not a financial instrument or security.
