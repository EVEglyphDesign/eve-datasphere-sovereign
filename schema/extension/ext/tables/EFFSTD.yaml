table: EFFSTD
module: EXT
description: Reporting standard datapoint registry. Maps an effect category to the published disclosure
  point it answers — a GRI, ESRS, ISSB or SASB code — so a community's own measurement can be reported
  outward in the language a regulator or auditor already reads, without the community having to adopt
  that vocabulary internally.
source: EVEglyphDesign extension. Standard codes are references to their publishers, not reproductions.
