table: AUSP
module: CROSS
description: "Characteristic Values — the actual characteristic-value assignments against a classified object (OBJEK), the table that carries a class's data onto an object instance. Each row assigns one characteristic (ATINN, resolving to CABN) and one value (ATWRT, or the numeric ATFLV/ATFLB range) to an object; combined with CAWN for predefined value texts and KLAH/CABN for the class/characteristic definitions, this is the operative layer of SAP's classification-based extension mechanism — where ESG and interaction-record attributes attach without touching the object's own standard table. SAP's real AUSP carries all its fields; this definition carries the table complete."
source: https://leanx.eu/en/sap/table/ausp.html
