table: ADRC
module: CROSS
description: "Addresses (Business Address Services) — the central address table every ADRNR/ADDRNUMBER field in the model resolves to. ADRC holds the postal name, street, city, region, country, and default-communication-method data for every business partner, customer, vendor, company code, plant, and personnel address in the system; ADR2 (telephone), ADR3 (fax), and ADR6 (e-mail) are its per-communication-type child tables, all keyed on ADDRNUMBER back to this header. SAP's real ADRC carries roughly 95 fields covering city/street-file validation, PO-box handling, and township/county extensions; this definition carries the full postal identity, key/organizational fields, language, region/country linkage, default communication flags, and the UUID/error-status fields — the set any address resolution or downstream ESG/interaction-record join actually consumes, not every not-supported legacy field."
source: https://leanx.eu/en/sap/table/adrc.html
