table: KLAH
module: CROSS
description: "Class Header Data — the class master of SAP's classification system, the extension mechanism SAP itself sanctions for attaching arbitrary characteristics (CABN/CAWN) to any object without altering the object's own standard fields. This matters directly for this model: ESG attributes and interaction-record metadata that don't belong on a standard master table are intended to attach here, at the classification edge, rather than through custom fields bolted onto core tables. KLAH holds one row per class (CLASS/CLINT), its type (KLART, via TCLA), status (STATU, via TCLU), and characteristics-table linkage; the actual characteristic assignments live in AUSP against the classified object, keyed via CABN. SAP's real KLAH carries roughly 55 fields, mostly document-linkage and display-formatting control; this definition carries the full key, classification-status, class-type, and document/document-linkage fields plus the base unit of measure — the set that identifies a class and its status, not every list-display formatting flag."
source: https://leanx.eu/en/sap/table/klah.html
