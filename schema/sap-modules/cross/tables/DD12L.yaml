table: DD12L
module: CROSS
description: "Secondary indexes, header — the registry of every secondary (non-primary) database index defined on a table, including uniqueness and per-database-system inclusion/exclusion. This matters to the sovereign mirror because a crosswalk's claim that a field or field combination is uniquely identifying, or that a lookup is index-supported, is checkable against DD12L rather than inferred from query behavior — the mirror can confirm the customer's own system actually defines that index instead of trusting a performance assumption. Table carried complete."
source: https://leanx.eu/en/sap/table/dd12l.html
fields:
  - name: SQLTAB
    description: "Table Name"
    data_element: TABNAME
    check_table: DD02L
    datatype: CHAR
    length: 30
    decimals: 0
    key: true
  - name: INDEXNAME
    description: "Unique Index ID in a Table"
    data_element: INDEXID
    check_table: ~
    datatype: CHAR
    length: 3
    decimals: 0
    key: true
  - name: AS4LOCAL
    description: "Activation Status of a Repository Object"
    data_element: AS4LOCAL
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: true
  - name: AS4VERS
    description: "Version of the entry (not used)"
    data_element: AS4VERS
    check_table: ~
    datatype: NUMC
    length: 4
    decimals: 0
    key: false
  - name: AUTHCLASS
