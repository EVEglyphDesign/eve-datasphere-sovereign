table: T001
module: CROSS
description: "Company Codes — the organizational-unit master every FI table's BUKRS field checks against. SAP's real T001 carries roughly 90 configuration-control fields (posting-period variants, workflow variants, tax-procedure links); this definition carries the core identity, currency, and cross-module linkage fields that a dealer tie-out actually consumes, not the full configuration surface. Accuracy over padding: fields listed below are real T001 fields confirmed against source, not the entire table."
source: https://leanx.eu/en/sap/table/t001.html
