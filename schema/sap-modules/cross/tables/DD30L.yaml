table: DD30L
module: CROSS
description: "Search helps — the header registry for elementary and collective search helps (F4 value-help definitions): selection method, selection method type, exit module, hotkey, and dialog behavior. Search helps are frequently where a crosswalk's implicit business rule about 'what values are valid here' is actually enforced at data-entry time in the source system, so DD30L lets the mirror check whether a claimed value-help constraint genuinely exists in the customer's dictionary, and what selection method actually backs it, rather than inferring intent from the field's domain alone. SAP's real DD30L carries roughly 25 fields (including newer fuzzy-search fields); this definition carries the full functional field set that a crosswalk or validation engine actually consumes."
source: https://leanx.eu/en/sap/table/dd30l.html
fields:
