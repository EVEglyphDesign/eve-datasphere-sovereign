table: DD01L
module: CROSS
description: "Domains — the ABAP Dictionary's atomic value-type registry: for every domain, its base datatype, length, decimals, case sensitivity, sign, conversion exit, and (via VALEXI/ENTITYTAB) whether it is bound to fixed values or a value table. DD01L is where a field's technical contract — what characters, what length, what range — is actually defined before any data element or table field inherits it. This is the metadata backbone layer: it is what lets the sovereign mirror validate itself. A crosswalk claim about a field's permissible values or format is not something the mirror has to trust from documentation — it can look up the domain in the customer's own DD01L and check the claim against the customer's own dictionary. SAP's real DD01L carries roughly 40 fields (activation/versioning housekeeping, proxy/append/BIDI flags); this definition carries the full functional field set — identity, datatype/length/decimals, case and sign handling, conversion exit, and fixed-value/value-table linkage — that a crosswalk or validation engine actually consumes."
source: https://leanx.eu/en/sap/table/dd01l.html
