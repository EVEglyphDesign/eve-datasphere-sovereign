    datatype: CHAR
    length: 4
    decimals: 0
    key: false
  - name: ROWTYPE
    description: "Name of row type for table types"
    data_element: TTROWTYPE
    check_table: DDTYPES
    datatype: CHAR
    length: 30
    decimals: 0
    key: false
  - name: ROWKIND
