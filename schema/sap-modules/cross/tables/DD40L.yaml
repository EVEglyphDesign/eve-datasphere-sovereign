table: DD40L
module: CROSS
description: "Table Types (internal tables defined in the ABAP Dictionary) — the DD's table-type header registry: row type, row kind, key definition and category, generic-type flag, and access mode for internal-table types, completing the dictionary layer already defined here (DD01L through DD30L). Client-independent, like the rest of the DD0xL/DD1xL/DD2xL/DD3xL family."
source: https://leanx.eu/en/sap/table/dd40l.html
fields:
  - name: TYPENAME
    description: "Name of table type"
    data_element: TTYPENAME
    check_table: ~
    datatype: CHAR
    length: 30
    decimals: 0
    key: true
  - name: AS4LOCAL
    description: "Activation Status of a Repository Object"
    data_element: AS4LOCAL
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
  - name: ACTFLAG
