    data_element: DDLENG
    check_table: ~
    datatype: NUMC
    length: 6
    decimals: 0
    key: false
  - name: DECIMALS
    description: "Number of Decimal Places"
    data_element: DECIMALS
    check_table: ~
    datatype: NUMC
    length: 6
    decimals: 0
    key: false
  - name: ACCESSMODE
    description: "Access modes for table types"
    data_element: ACCESSMODE
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
  - name: KEYDEF
