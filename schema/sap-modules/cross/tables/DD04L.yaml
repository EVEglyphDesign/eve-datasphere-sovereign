table: DD04L
module: CROSS
description: "Data elements — the semantic layer between a domain (DD01L, pure datatype) and a table field (DD03L, physical placement): each data element binds a domain to field labels (short/medium/long/heading text), a set/get parameter ID, and optionally a search help. DD04L is where SAP's business meaning for a field actually lives — 'this is a Company Code' rather than 'this is a 4-character string' — and it is the layer the mirror uses to check that a crosswalk's claimed business semantics for a field match what the customer's own dictionary declares, not just that the datatypes are compatible. SAP's real DD04L carries roughly 37 fields, several BIDI/history/proxy display flags among them; this definition carries the full functional field set — identity, domain linkage, label lengths, memory ID, search-help linkage, and datatype/length/decimals — that a crosswalk or validation engine actually consumes."
source: https://leanx.eu/en/sap/table/dd04l.html
