table: CABN
module: CROSS
description: "Characteristic — the master definition of a classification characteristic (name, data type, length, decimals, unit, value-entry rules), the row ATINN in AUSP and CAWN resolves to. CABN defines what a characteristic is and how its values are validated; CAWN carries its predefined value texts, AUSP carries its actual assignments to objects. This is the definitional layer of the classification extension mechanism that lets ESG and interaction-record attributes be declared without modifying any standard table structure. SAP's real CABN carries roughly 68 fields, most of them display/formatting and hierarchy-navigation control; this definition carries the full key, characteristic identity, data-type/length/decimal, unit-of-measure, value-entry-control, and class-linkage fields — the set that defines a characteristic's shape and validation, not every UI display flag."
source: https://leanx.eu/en/sap/table/cabn.html
