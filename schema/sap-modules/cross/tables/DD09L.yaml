table: DD09L
module: CROSS
description: "Technical settings of tables — the physical/storage configuration for each table registered in DD02L: data class, size category, buffering type, generic-buffer key-field count, change logging, and row/column store designation. This is not semantic metadata like DD01L/DD03L/DD04L; it is operational metadata the mirror uses to sanity-check crosswalk assumptions about a table's runtime behavior — e.g. whether a table is buffered (and therefore may show stale reads to certain report paths) or whether change logging is active (and therefore audit trail claims are checkable). Table carried complete."
source: https://leanx.eu/en/sap/table/dd09l.html
