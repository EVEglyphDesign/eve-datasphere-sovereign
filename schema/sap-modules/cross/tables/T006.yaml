description: "Units of Measurement — the most heavily-referenced check table in this repository (221 field-level references across MM/PM/PP/QM/SD tables already defined, per a repository-wide grep on 2026-07-30). Added even though it was not named in the original request, because it clears the single largest concentration of dangling check-table references in the schema, ahead of any other candidate by more than 2x."
source: https://leanx.eu/en/sap/table/t006.html
