table: T005
module: CROSS
description: "Countries — the master check table nearly every LAND1/COUNTRY field across every module in this repository resolves against (ADRC.COUNTRY, T001.LAND1, ADR2/ADR3.COUNTRY, and dozens more). Carries per-country validation rules for postal codes, bank data, VAT numbers, and tax jurisdiction, plus the country's own currency and language defaults. SAP's real T005 carries roughly 60 fields, most of them field-length/validation-rule pairs for bank and tax-number formats; this definition carries the full key, ISO-code, currency, language, and EU/tax-relevant identity fields — the set any address, tax, or currency crosswalk actually consumes, not every per-field validation-rule pair."
source: https://leanx.eu/en/sap/table/t005.html
