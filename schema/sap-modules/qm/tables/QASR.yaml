table: QASR
module: QM
description: "Sample Results for Inspection Characteristics — the per-partial-sample measured-value record for one inspection characteristic within an inspection lot (statistics, defect counts, valuation, defect-code assignment), keyed one level finer than QAMR by PROBENR. One of the two measured-value tables alongside QAMR (characteristic-level results); rolls up to the usage decision in QAVE."
source: https://leanx.eu/en/sap/table/qasr.html
