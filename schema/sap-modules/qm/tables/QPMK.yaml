table: QPMK
module: QM
description: "Master Inspection Characteristic — the reusable, plant-specific master definition of an inspection characteristic (target value, tolerance/specification limits, class widths, plausibility limits, rejection defect codes, control-indicator string). Referenced by inspection-plan characteristics; its text is carried in QPMT. Wide table — carries the full field set as published by the source (74 fields), including all tolerance/limit/class fields and rejection defect-code assignments; no truncation applied."
source: https://leanx.eu/en/sap/table/qpmk.html
