table: QAVE
module: QM
description: "Inspection Processing: Usage Decision — the final disposition record for an inspection lot (or partial lot/single unit), carrying the selected-set/code-group/code combination, valuation, follow-up action, quality score, and who/when recorded or changed the decision. The usage-decision table alongside the measured-value tables QAMR/QASR."
source: https://leanx.eu/en/sap/table/qave.html
