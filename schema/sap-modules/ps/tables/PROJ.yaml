table: PROJ
module: PS
description: "Project definition — the root master-data object for a SAP Project System project: one row per project (PSPID external ID / PSPNR internal number), carrying the organizational assignment (company code, business area, controlling area, profit center, plant), the profile stack that drives WBS/network/budget/planning behavior, responsible-person and applicant data, planned/forecast overall dates, and status-profile links. Every WBS element in PRPS carries a PSPHI foreign key back to this table's PSPNR, so PROJ is the header a whole WBS tree (PRPS/PRHI/PRTE/PRTX) hangs off. SAP's real PROJ table carries roughly 100 fields, including retail/production-lot fields (ZFILE*, SORT*), Joint Venture Accounting fields (VNAME/RECID/ETYPE/OTYPE/JIBCL/JIBSA), and FERC regulatory fields; this definition is scoped to the key, organizational, profile, date, and status fields the model consumes — the full field list is documented in the source below and no field has been silently dropped from the categories the mirror tracks."
source: https://leanx.eu/en/sap/table/proj.html
