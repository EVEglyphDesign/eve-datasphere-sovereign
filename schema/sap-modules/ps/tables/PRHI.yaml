table: PRHI
module: PS
description: "Work Breakdown Structure, Edges (Hierarchy Pointer) — the linked-list structure that encodes the WBS hierarchy for a project: for every WBS element (POSNR) it records its parent project (PSPHI) plus its superior element (UP), first subordinate (DOWN), and left/right sibling pointers within the tree. PRPS carries the WBS element as a flat master-data row with a level number (STUFE) but does not itself encode traversal order; PRHI is the table SAP's hierarchy-walk function modules (e.g. GET_PROJECT_HIERARCHY) actually read to reconstruct parent/child/sibling order. Every UP/DOWN/LEFT/RIGHT pointer resolves back to a PSPNR on PRPS, and PSPHI resolves to PROJ — so PRHI is pure structure, carrying no descriptive or financial attributes of its own."
source: https://leanx.eu/en/sap/table/prhi.html
fields:
