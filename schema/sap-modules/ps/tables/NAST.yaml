table: NAST
module: PS
description: "Message Status — the cross-application output/message-control table (NAST is technically owned by SAP Basis/cross-application message determination, not PS-specific, but is landed under this lane because it is the table that records output/print/EDI/fax status for PS objects such as project and WBS-element correspondence): one row per determined message (KAPPL application, OBJKY object key, KSCHL message/condition type, KSCHL+SPRAS+PARNR+PARVW partner routing) carrying the transmission medium (NACHA), dispatch timing (VSZTP/VSDAT/VSURA/VSURB), processing status (VSTAT) and processing date/time (DATVR/UHRVR), spool/print destination (LDEST/DSNAM/TDNAME), and repeat/change flags. For a PS WBS element or project, OBJKY holds the object's key (e.g. the WBS element or project number) and KAPPL identifies the PS output application, letting the model tie a project/WBS master record to the correspondence and output history generated against it."
source: https://leanx.eu/en/sap/table/nast.html
