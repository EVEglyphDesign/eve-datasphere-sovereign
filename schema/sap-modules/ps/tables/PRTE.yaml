table: PRTE
module: PS
description: "Scheduling Data for Project Item — one row per WBS element (POSNR, resolving to PRPS-PSPNR, under project PSPHI resolving to PROJ) carrying the full basic/forecast/actual date triad (start, finish, duration and unit for each) plus the derived earliest/latest scheduled start and finish dates and the manual-override/activity-derived indicator flags that the PS scheduling engine (network scheduling roll-up to WBS) writes back after each scheduling run. This is the date-bearing counterpart to PRPS: PRPS carries the WBS master record and status, PRTE carries when that WBS element is actually scheduled to happen."
source: https://leanx.eu/en/sap/table/prte.html
