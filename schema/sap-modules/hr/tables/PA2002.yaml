table: PA2002
module: HR
description: "HR Time Record: Infotype 2002 (Attendances) — the other of the two time-evaluation input infotypes (alongside PA2001 Absences) that pair with the already-defined AFRU confirmations: attendance type (AWART), start/end time and break periods, days and hours counted for attendance/payroll purposes, overtime compensation type, wage type and valuation basis for differential payment, and external document linkage, keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. This infotype is personal data — it records an identifiable employee's actual worked time and overtime — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa2002.html
