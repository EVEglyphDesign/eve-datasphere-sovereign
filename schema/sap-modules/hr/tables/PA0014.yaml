table: PA0014
module: HR
description: "HR Master Record: Infotype 0014 (Recurring Payments and Deductions) — recurring pay-slip line items outside basic pay: wage type, amount/currency, number and unit for indirect valuation, first-payment date/period and recurrence interval, bank-transfer date, assignment number, and payment model, keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. This complements PA0008 Basic Pay as the recurring allowances/deductions feed into payroll. This infotype is personal data — it discloses an identifiable employee's recurring pay components and deductions — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa0014.html
