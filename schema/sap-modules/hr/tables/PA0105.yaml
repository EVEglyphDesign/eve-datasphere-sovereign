table: PA0105
module: HR
description: "HR Master Record: Infotype 0105 (Communications) — the join between a person and their system identity: communication type (USRTY, e.g. system user ID, e-mail address, and other configured communication channels via subtype T591A) paired with the identifier/number itself (USRID, plus a long-form USRID_LONG for values exceeding 30 characters such as full e-mail addresses), keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. This is the infotype consuming systems mirror to resolve a PERNR to a login/user ID or e-mail address. This infotype is personal data — it links an identifiable employee to system credentials and contact identifiers such as e-mail — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa0105.html
