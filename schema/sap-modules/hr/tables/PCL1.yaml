table: PCL1
module: HR
description: "HR Cluster 1 — a generic HR cluster-database table. Its payload (CLUSTD) is stored as compressed, opaque cluster data addressed by a relation-ID/key/cluster-number combination (RELID/SRTFD/SRTF2/CLUSTR), not as readable columns: SAP writes structured ABAP internal tables into this raw LRAW field via the IMPORT/EXPORT cluster mechanism, and the field contents cannot be interpreted without an ABAP program performing the corresponding IMPORT. A mirror of this table can capture the key fields and the CLUSTD blob as an opaque byte value, but it cannot field-decode the payload — there is no field-level readability without running the original ABAP cluster-import logic against SAP's cluster definitions (e.g. PCL1's relation IDs typically cover applicant/recruitment-related cluster data). This table is personal data — whatever an application stored in the cluster blob may include identifiable employee or applicant details — and any mirrored copy (key plus opaque blob) must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pcl1.html
fields:
  - name: CLIENT
    description: "Client"
    data_element: MANDT
    check_table: ~
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: RELID
    description: "Area Identification on Import/Export Database PCL1 — identifies which logical cluster relation (application) this row's blob belongs to"
    data_element: RELID_PCL1
    check_table: ~
    datatype: CHAR
    length: 2
    decimals: 0
    key: true
  - name: SRTFD
    description: "PCLx Key — the business key (e.g. personnel number plus sub-identifiers) for the clustered record"
    data_element: PCLKEY
    check_table: ~
    datatype: CHAR
    length: 40
    decimals: 0
    key: true
  - name: SRTF2
    description: "Sort Field for PCLx (Duplicate Key)"
    data_element: PCLSRTFD
    check_table: ~
    datatype: INT4
    length: 10
    decimals: 0
    key: true
  - name: HISTO
    description: "Historical Record Flag"
    data_element: HISTO
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
  - name: AEDTM
    description: "Changed On"
    data_element: AEDAT
    check_table: ~
    datatype: DATS
    length: 8
    decimals: 0
    key: false
  - name: UNAME
    description: "User Name"
    data_element: UNAME
    check_table: ~
    datatype: CHAR
    length: 12
    decimals: 0
    key: false
  - name: PGMID
    description: "ABAP: Program Name — the program that wrote this cluster record"
    data_element: OLD_PROG
    check_table: ~
    datatype: CHAR
    length: 8
    decimals: 0
    key: false
  - name: VERSN
    description: "Version in Cluster Files"
    data_element: PVRSN
    check_table: ~
    datatype: CHAR
    length: 2
    decimals: 0
    key: false
  - name: CLUSTR
    description: "Cluster for PCLx — the cluster-ID sub-selector within the RELID area"
    data_element: PCLCLUSTR
    check_table: ~
    datatype: INT2
    length: 5
    decimals: 0
    key: false
  - name: CLUSTD
    description: "Compressed cluster payload (opaque raw bytes) — NOT field-decodable without ABAP IMPORT against SAP's cluster structure definitions; a mirror can only store this as a binary blob keyed by RELID/SRTFD/SRTF2/CLUSTR, never as individual readable fields"
    data_element: PCLDATA
    check_table: ~
    datatype: LRAW
    length: 3900
    decimals: 0
    key: false
foreign_keys:
  - field: CLIENT
    check_table: T000
    check_field: MANDT

