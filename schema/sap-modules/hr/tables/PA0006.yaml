table: PA0006
module: HR
description: "HR Master Record: Infotype 0006 (Addresses) — an employee's address records (permanent, mailing, emergency-contact, etc. via subtype ANSSA): street, house number, city, district, postal code, country/region, telephone, commute distance, and up to six generic communication-type/number pairs (COM01-06/NUM01-06), keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. SAP's real table also carries Japan-localization address-script fields (Katakana); this definition carries the complete field list as sourced. This infotype holds an identifiable employee's home address and personal contact details and is personal data — any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa0006.html
