table: PA0001
module: HR
description: "HR Master Record: Infotype 0001 (Organizational Assignment) — the personnel administration infotype that carries an employee's org placement: personnel number, name, cost centre, org unit, position, job, personnel area/subarea, employee group/subgroup, and the validity interval (BEGDA/ENDDA) under which that assignment holds. This is the SAP analogue the CDK twin's employee/technician master keys on: personnel number ↔ technician ID, cost centre ↔ department, org unit/position ↔ role."
source: https://leanx.eu/en/sap/table/pa0001.html
