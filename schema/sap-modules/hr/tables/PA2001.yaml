table: PA2001
module: HR
description: "HR Time Record: Infotype 2001 (Absences) — one of the two time-evaluation input infotypes (the other being PA2002 Attendances) that pair with the already-defined AFRU confirmations: attendance/absence type (AWART), start/end time, days and hours counted for attendance/absence, payroll, and continued-pay purposes, sickness-tracking dates and indicators, and off-cycle payroll linkage, keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. This infotype is personal data — it records an identifiable employee's leave, sickness, and absence history, including illness-related indicators — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa2001.html
