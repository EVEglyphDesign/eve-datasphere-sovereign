table: PA0000
module: HR
description: "HR Master Record: Infotype 0000 (Actions) — the employment-event record for a personnel number: every hire, transfer, re-organization, and termination is written here as a dated action (MASSN) with a reason (MASSG) and the resulting employment/customer/special-payment status flags (STAT1/STAT2/STAT3), under the same validity-interval key pattern (BEGDA/ENDDA/SEQNR) as PA0001 Organizational Assignment, which this infotype's actions actually trigger. This infotype carries personal data — it records an identifiable employee's employment history and status — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa0000.html
