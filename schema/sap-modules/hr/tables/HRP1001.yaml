table: HRP1001
module: HR
description: "Infotype 1001 DB Table — the organizational-management relationships table, and the important one of the three OM tables (alongside HRP1000 object master and HRP1002 object descriptions), because SAP expresses org structure as directed relationship edges between objects rather than as a hierarchy column: a source object (OTYPE/OBJID/PLVAR) is linked to a related object (SCLAS/SOBID) via a typed relationship (RELAT, with direction sign RSIGN) — e.g. an org unit 'reports to' another org unit, a position 'belongs to' an org unit, or a person 'holds' a position — under a validity interval. Reconstructing the org chart or resolving who holds a given position requires walking this relationship table, not reading a parent-column. This table is personal data when a relationship links to a person-holding object (e.g. a position-holder relationship terminating in a PERNR-linked object) — any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/hrp1001.html
