table: HRP1002
module: HR
description: "Infotype 1002 DB Table — the organizational-management object descriptions/free-text table, the third of the three OM tables alongside HRP1000 (object master) and HRP1001 (relationships, the important one since org structure lives in relationship edges, not a hierarchy column): a long-text description for a given object (OTYPE/OBJID/PLVAR), referenced via TABNR into the text/table-extension storage, under a validity interval. This table is personal data when the described object is a person-holding object — any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/hrp1002.html
