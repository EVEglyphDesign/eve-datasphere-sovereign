table: HRP1000
module: HR
description: "Infotype 1000 DB Table — the organizational-management object master: every object (org unit, position, job, cost center, task, etc., typed via OTYPE/OBJID under plan version PLVAR) with its short and long text (SHORT/STEXT), search-helper fields, planning status, and validity interval. This is one of the three organizational management tables alongside HRP1001 (relationships between objects — the important one, since SAP expresses org structure as relationships rather than a hierarchy column) and HRP1002 (object descriptions/texts); HRP1000 is the object registry that HRP1001's relationship rows and HRP1002's text rows both point back to via OTYPE/OBJID/PLVAR. This table is personal data when the object type is a person-holding object (e.g. position occupancy is resolved via HRP1001 relationships back to a PERNR) — any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/hrp1000.html
