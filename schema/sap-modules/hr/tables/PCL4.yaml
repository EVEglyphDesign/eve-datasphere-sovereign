table: PCL4
module: HR
description: "HR Cluster 4 — the tax-reporting and year-end cluster database table (e.g. legal/statutory reporting clusters). Its payload (CLUSTD) is stored as compressed, opaque cluster data addressed by a relation-ID/key/cluster-number combination (RELID/SRTFD/SRTF2/CLUSTR), not as readable columns: SAP writes a structured tax/legal-reporting internal table into this raw LRAW field via the IMPORT/EXPORT cluster mechanism, and the field contents cannot be interpreted without an ABAP program performing the corresponding IMPORT against the relevant cluster structure. A mirror of this table can capture the key fields and the CLUSTD blob as an opaque byte value, but it cannot field-decode tax amounts, statutory form data, or any other reporting detail — there is no field-level readability without running the original ABAP cluster-import logic. This table is personal data — the cluster blob is, in practice, an employee's tax and statutory-filing history — and any mirrored copy (key plus opaque blob) must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pcl4.html
fields:
  - name: CLIENT
    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: RELID
    description: "Area ID in Import/Export Database PCL4 — identifies which logical cluster relation (e.g. tax/statutory reporting) this row's blob belongs to"
    data_element: RELID_PCL4
    check_table: ~
    datatype: CHAR
    length: 2
    decimals: 0
    key: true
  - name: SRTFD
    description: "PCLx Key — the business key (typically personnel number plus tax-year/reporting-period identifiers) for the clustered record"
    data_element: PCLKEY
    check_table: ~
    datatype: CHAR
    length: 40
    decimals: 0
    key: true
  - name: SRTF2
    description: "Sort Field for PCLx (Duplicate Key)"
    data_element: PCLSRTFD
    check_table: ~
    datatype: INT4
    length: 10
    decimals: 0
    key: true
  - name: HISTO
    description: "Historical Record Flag"
    data_element: HISTO
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
  - name: AEDTM
    description: "Changed On"
    data_element: AEDAT
    check_table: ~
    datatype: DATS
    length: 8
    decimals: 0
    key: false
  - name: UNAME
    description: "User Name"
    data_element: UNAME
    check_table: ~
    datatype: CHAR
    length: 12
    decimals: 0
    key: false
  - name: PGMID
    description: "ABAP: Program Name — the program (typically a legal/tax reporting driver) that wrote this cluster record"
    data_element: OLD_PROG
    check_table: ~
    datatype: CHAR
    length: 8
    decimals: 0
    key: false
  - name: VERSN
    description: "Version in Cluster Files"
    data_element: PVRSN
    check_table: ~
    datatype: CHAR
    length: 2
    decimals: 0
    key: false
  - name: CLUSTR
    description: "Cluster for PCLx — the cluster-ID sub-selector within the RELID area (e.g. the specific tax-reporting cluster)"
    data_element: PCLCLUSTR
    check_table: ~
    datatype: INT2
    length: 5
    decimals: 0
    key: false
  - name: CLUSTD
    description: "Compressed cluster payload (opaque raw bytes) — this is where an employee's tax/statutory-reporting data actually lives, but it is NOT field-decodable without ABAP IMPORT against SAP's tax-reporting cluster structure; a mirror can only store this as a binary blob keyed by RELID/SRTFD/SRTF2/CLUSTR, never as individual readable fields"
    data_element: PCLDATA
    check_table: ~
    datatype: LRAW
    length: 3900
    decimals: 0
    key: false
foreign_keys:
  - field: CLIENT
    check_table: T000
    check_field: MANDT

