table: PA0007
module: HR
description: "HR Master Record: Infotype 0007 (Planned Working Time) — the employee's work-schedule assignment: work schedule rule (SCHKZ), time-management status, employment percentage, and the daily/weekly/monthly/annual planned-hours envelope (target plus min/max bounds), keyed by personnel number under the same validity-interval pattern as PA0001 Organizational Assignment. This is the planning-side counterpart to PA2001 Absences and PA2002 Attendances, which record actual time against this planned baseline. This infotype is personal data — it reflects an identifiable employee's individual work-time arrangement (including part-time status) — and any mirrored copy must be handled under consent-scoped access controls."
source: https://leanx.eu/en/sap/table/pa0007.html
