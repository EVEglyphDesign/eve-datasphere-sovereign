# FI (Financial Accounting) — table inventory
# Sources: SAP Help Portal, leanx.eu, public community references.
module: FI
description: "Financial Accounting — GL, AR, AP, Asset Accounting, Bank Accounting. The ACDOCA-facing side of the ledger."

tables:
  # ------------- Universal Journal (S/4HANA) -------------
  - name: ACDOCA
    description: "Universal Journal Entry Line Items — S/4HANA. THE canonical line-level table. Every FI/CO posting flows through here."
    domain: universal_journal
  - name: ACDOCP
    description: "Universal Journal Plan Data"
    domain: universal_journal
  - name: ACDOCU
    description: "Universal Journal Update Records"
    domain: universal_journal

  # ------------- Classic FI Documents (ECC + coexistence in S/4) -------------
  - name: BKPF
    description: "Accounting Document Header"
    domain: document
  - name: BSEG
    description: "Accounting Document Segment (line items)"
    domain: document
  - name: BSAK
    description: "Cleared vendor items"
    domain: document
  - name: BSAS
    description: "Cleared G/L account items"
    domain: document
  - name: BSAD
    description: "Cleared customer items"
    domain: document
  - name: BSIK
    description: "Open vendor items"
    domain: document
  - name: BSIS
    description: "Open G/L account items"
    domain: document
  - name: BSID
    description: "Open customer items"
    domain: document

  # ------------- Chart of Accounts / GL Master -------------
  - name: SKA1
    description: "G/L Account Master (Chart of Accounts)"
    domain: gl_master
  - name: SKB1
    description: "G/L account master (Company Code)"
    domain: gl_master
  - name: SKAT
    description: "G/L Account Master Record — Descriptions"
    domain: gl_master
  - name: T001
    description: "Company Codes"
    domain: org
  - name: T001W
    description: "Plants/Branches"
    domain: org
  - name: TGSB
    description: "Business Areas"
    domain: org

  # ------------- General Ledger (New GL / Classic) -------------
  - name: FAGLFLEXA
    description: "New GL Actual Line Items (superseded by ACDOCA in S/4HANA)"
    domain: ledger
  - name: FAGLFLEXT
    description: "New GL totals table"
    domain: ledger
  - name: GLT0
    description: "Classic G/L totals"
    domain: ledger

  # ------------- Vendor (AP) master -------------
  - name: LFA1
    description: "Vendor Master (General Section)"
