table: FEBEP
module: FI
description: "Electronic Bank Statement Line Items — each individual memo/transaction line within an imported bank statement (amount, value date, business transaction code, posting rule, partner bank details, and the resulting subledger/accounting document number), keyed by KUKEY (pointing to its FEBKO header) plus ESNUM. This is where the bank statement's cash movements are matched to open items and posted: BELNR/NBBLN carry the accounting or subledger document number that the interpretation algorithm created, and that document is what lands in BSEG and, in S/4HANA, ACDOCA — an FEBEP line whose amount (KWBTR) and posted document don't agree with the corresponding ACDOCA bank-clearing entry is exactly the drift point cash-side reconciliation is built to catch. SAP's real table carries 100+ fields (BDC helper fields, lockbox and lockbox-batch fields, lockbox lockbox-only algorithm fields); this definition is scoped to the key, all date/amount/currency fields, all document-linkage fields, and all account-assignment/reference fields a reconciliation or crosswalk would consume."
source: https://leanx.eu/en/sap/table/febep.html
