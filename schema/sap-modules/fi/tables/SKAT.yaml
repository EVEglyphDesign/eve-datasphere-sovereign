    check_table: T000
    check_field: MANDT
  - field: SPRAS
    check_table: T002
    check_field: SPRAS
  - field: KTOPL
    check_table: T004
    check_field: KTOPL
  - field: SAKNR
    check_table: SKA1
    check_field: SAKNR

