table: KNVV
module: FI
description: "Customer Master Sales Data — the sales-area-level view of the customer master (sales organization/distribution channel/division), carrying order/delivery/billing blocks, pricing procedure, credit control area, incoterms, and payment terms used wherever an SD document needs to resolve customer sales-area defaults. Sits alongside KNA1 (general) and KNB1/KNB1-style company code data in the customer master's structure."
source: https://leanx.eu/en/sap/table/knvv.html
