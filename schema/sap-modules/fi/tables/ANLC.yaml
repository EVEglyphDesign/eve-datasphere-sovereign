table: ANLC
module: FI
description: "Asset Value Fields — cumulative and annual asset values (acquisition cost, ordinary/special/unplanned depreciation, revaluation, transfers) by depreciation area and fiscal year, one row per asset per area per year. This is the balance-carrying twin of ANLA/ANLB: it holds the year-end APC and accumulated-depreciation balances that the depreciation area's ledger must equal, and every posted movement here should trace back to ANEP/ANEK line items and forward to the corresponding G/L balance in ACDOCA/BSEG for the linked asset G/L accounts — a mismatch between ANLC's cumulative fields and ACDOCA's asset reconciliation accounts is the classic sign of a depreciation-run posting that didn't fully land in the universal journal."
source: https://leanx.eu/en/sap/table/anlc.html
