table: BSIS
module: FI
description: "Accounting: Secondary Index for G/L Accounts — open (uncleared) G/L line items. The final piece of the open-item picture alongside BSID/BSAD (customer) and BSIK/BSAK (vendor): one row per open item sitting behind a G/L account that carries open-item management (e.g. GR/IR, bank clearing, salary clearing), keyed by company code + G/L account + document, until AUGBL/AUGDT clear it into BSAS."
source: https://leanx.eu/en/sap/table/bsis.html
