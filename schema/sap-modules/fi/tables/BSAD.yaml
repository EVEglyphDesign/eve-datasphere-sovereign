table: BSAD
module: FI
description: "Accounting: Secondary Index for Customers (Cleared Items) — same row shape as BSID, but for items that have already been cleared (AUGDT/AUGBL populated). This is the destination an open item on the dealer's accounting schedule moves to the moment a payment or credit is applied — the clearing event a schedule-to-GL reconciliation has to account for, not just the open balance."
source: https://leanx.eu/en/sap/table/bsad.html
fields:
  - name: MANDT
    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: BUKRS
    description: "Company Code"
    data_element: BUKRS
    check_table: T001
    datatype: CHAR
    length: 4
    decimals: 0
    key: true
