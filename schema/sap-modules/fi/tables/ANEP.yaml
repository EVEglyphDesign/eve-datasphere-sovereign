table: ANEP
module: FI
description: "Asset Line Items — the depreciation-area-level value movements for an asset transaction (amount posted, ordinary/special depreciation, interest on the transaction), one row per ANEK header per real depreciation area, keyed by BUKRS/ANLN1/ANLN2/GJAHR/LNRAN/AFABE. ANEP is where an asset posting actually carries its amounts: BELNR/BUZEI tie each row to the accounting document that also hit BSEG and ACDOCA, and the depreciation-area split here (AFABE) is what must sum, area by area, to the annual balances carried in ANLC — a break between ANEP's postings and ACDOCA's asset reconciliation-account balance is the most direct evidence of subledger drift."
source: https://leanx.eu/en/sap/table/anep.html
