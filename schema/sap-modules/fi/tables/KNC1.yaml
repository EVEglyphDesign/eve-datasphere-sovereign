table: KNC1
module: FI
description: "Customer Master (Transaction Figures) — annual and monthly debit/credit/sales totals per customer per company code per fiscal year. This is the balance-carried-forward and period-total record that a schedule reconciliation checks BSID/BSAD roll-forward totals against."
source: https://leanx.eu/en/sap/table/knc1.html
fields:
  - name: MANDT
    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: KUNNR
    description: "Customer Number"
    data_element: KUNNR
    check_table: KNA1
    datatype: CHAR
    length: 10
    decimals: 0
    key: true
  - name: BUKRS
    description: "Company Code"
    data_element: BUKRS
    check_table: KNB1
    datatype: CHAR
    length: 4
    decimals: 0
    key: true
  - name: GJAHR
    description: "Fiscal Year"
    data_element: GJAHR
    check_table: ~
    datatype: NUMC
    length: 4
    decimals: 0
    key: true
  - name: ERDAT
    description: "Date on which the record was created"
    data_element: ERDAT
    check_table: ~
    datatype: DATS
    length: 8
    decimals: 0
    key: false
  - name: USNAM
    description: "User name"
    data_element: USNAM
    check_table: ~
    datatype: CHAR
    length: 12
    decimals: 0
    key: false
  - name: UMSAV
    description: "Balance Carried Forward in Local Currency"
    data_element: UMSAV
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: UM01S
    description: "Total of the Debit Postings for the Month (period 01)"
    data_element: UM01S
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: UM01H
    description: "Total of Credit Postings for the Month (period 01)"
    data_element: UM01H
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: UM01U
    description: "Sales in the Posting Period (period 01)"
    data_element: UM01U
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: BABZG
    description: "Authorized deductions"
    data_element: BABZG
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: UABZG
    description: "Accepted deductions taken after end of discount period"
    data_element: UABZG
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: KZINS
    description: "Acc.int.calc.numerator for payment arrears"
    data_element: KZINS
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
  - name: KUMAG
    description: "Accumulated clearing amount in fiscal year"
    data_element: KUMAG
    check_table: ~
    datatype: CURR
    length: 15
    decimals: 2
    key: false
notes:
  - "Periods 02 through 16 repeat the UMnnS / UMnnH / UMnnU triple shown for period 01 (48 CURR15,2 fields total: UM01S/H/U … UM16S/H/U). Only period 01 is spelled out here to avoid padding; the pattern is mechanical and identical across periods."
foreign_keys:
  - field: MANDT
    check_table: T000
    check_field: MANDT
  - field: KUNNR
    check_table: KNA1
    check_field: KUNNR
  - field: BUKRS
    check_table: KNB1
    check_field: BUKRS

