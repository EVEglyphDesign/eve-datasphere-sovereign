table: ANEK
module: FI
description: "Document Header Asset Posting — the header of an asset accounting document, one row per asset business transaction (acquisition, retirement, transfer, depreciation posting run) carrying document date, posting date, period, user, transaction type and the reference to the originating purchasing or accounting document. This is the asset subledger's own journal header and is the FI-AA counterpart of BKPF: BELNR/BUZEI on the paired ANEP line items point back to the accounting document that also posted to BSEG and, in S/4HANA, to ACDOCA — any asset document in ANEK that lacks a matching ACDOCA/BKPF document number is a sign the subledger and the universal journal have drifted apart."
source: https://leanx.eu/en/sap/table/anek.html
