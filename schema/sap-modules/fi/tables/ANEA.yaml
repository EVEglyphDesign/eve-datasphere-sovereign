table: ANEA
module: FI
description: "Asset Line Items for Proportional Values — the proportional (time-apportioned) cumulative and annual depreciation-area values attached to a specific ANEP line item, used chiefly for mid-year retirements and transfers where only part of the year's depreciation, revaluation, or reserve movement is attributable. Keyed one-to-one with an ANEP row (BUKRS/ANLN1/ANLN2/GJAHR/LNRAN/AFABE), it supplies the proportional figures (e.g. revenue and cost of retirement, ERLBT/VERKO) that feed the gain/loss postings on retirement — those postings are what ultimately hit the P&L and asset-disposal accounts in ACDOCA/BSEG, so ANEA's proportional splits must foot to the retirement amounts recognized in the universal journal for the transaction to reconcile."
source: https://leanx.eu/en/sap/table/anea.html
