table: ACDOCU
module: FI
description: "Universal Journal Entry Line Items — Consolidation — the unified/consolidation-journal companion to the ACDOCA actuals spine already defined in this repo, holding group-close (SAP S/4HANA for group reporting) consolidated line items in the same universal-journal shape as ACDOCA/ACDOCP. Used for intercompany elimination, currency translation, and consolidation-of-investment postings that produce the group-level financial statements. SAP's real table carries roughly 106 fields (source: saplearners.com field listing, corroborated by SAP Community descriptions of the S/4HANA Group Reporting universal journal); leanx.eu has no page for this HANA-era table, so this definition is scoped to the key, ledger, organizational (consolidation unit/company, cost/profit center, functional area, business area, controlling area, segment), account, amount (per-currency value fields), quantity, date, and version (consolidation end-result version) fields a group-close crosswalk consumes."
source: https://saplearners.com/sap-tables/acdocu/
fields:
