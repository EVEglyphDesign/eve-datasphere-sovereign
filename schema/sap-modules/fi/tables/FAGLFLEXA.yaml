table: FAGLFLEXA
module: FI
description: "General Ledger: Actual Line Items — the New G/L (new-GL) flexible line-item table, SAP's pre-S/4HANA ancestor of ACDOCA. Where S/4HANA writes every FI+CO+AA line to the single Universal Journal (ACDOCA), an ECC/New-GL customer writes the equivalent actual line item here, one row per ledger per document per line, split by dimension (profit center, segment, functional area, business area). A customer running classic ECC mirrors this table; a customer on S/4HANA mirrors ACDOCA — the model must read both to cover the FI lane across a customer's install base."
source: https://leanx.eu/en/sap/table/faglflexa.html
