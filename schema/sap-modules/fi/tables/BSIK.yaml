table: BSIK
module: FI
description: "Accounting: Secondary Index for Vendors — open (uncleared) vendor line items. The AP-side analogue of BSID: one row per open item behind an AP reconciliation account, keyed by company code + vendor + document, until AUGBL/AUGDT clear it into BSAK. This is where a dealer's sublet or parts-purchase payable sits before payment."
source: https://leanx.eu/en/sap/table/bsik.html
fields:
