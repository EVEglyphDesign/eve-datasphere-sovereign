table: BSID
module: FI
description: "Accounting: Secondary Index for Customers — open (uncleared) customer line items. This is the SAP analogue of a CDK accounting schedule sitting behind an AR reconciliation account: one row per open item, keyed by company code + customer + document, until AUGBL/AUGDT clear it into BSAD."
source: https://leanx.eu/en/sap/table/bsid.html
fields:
  - name: MANDT
    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: BUKRS
    description: "Company Code"
    data_element: BUKRS
    check_table: T001
    datatype: CHAR
    length: 4
    decimals: 0
    key: true
