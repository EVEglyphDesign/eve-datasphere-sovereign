table: FAGLFLEXT
module: FI
description: "General Ledger: Totals — the New G/L (new-GL) flexible totals table, SAP's pre-S/4HANA ancestor of the account/period aggregates a customer would otherwise derive by summarizing ACDOCA. Carries one row per ledger/company code/account/dimension combination with a balance-carryforward bucket plus 16 period buckets, in up to four parallel currencies (transaction, local, group, and a fourth freely-defined currency) and a quantity total. SAP's real table carries a full 16-period array per currency (TSL01-TSL16, HSL01-HSL16, KSL01-KSL16, OSL01-OSL16, MSL01-MSL16) plus 8 OBJNR table-group fields; this definition is scoped to the full key, all organizational/reference fields, and a representative period slice (carryforward + period 01 + period 12 + period 16) per currency/quantity bucket so a crosswalk can resolve the pattern without repeating all 80+ period columns verbatim. An ECC/New-GL customer mirrors this table for period/account balances; an S/4HANA customer derives the equivalent balance from ACDOCA directly."
source: https://leanx.eu/en/sap/table/faglflext.html
