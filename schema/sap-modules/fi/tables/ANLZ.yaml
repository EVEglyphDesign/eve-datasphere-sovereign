table: ANLZ
module: FI
description: "Time-Dependent Asset Allocations — cost centre, plant, business area, location, functional area, fund and profit-centre assignments for an asset, held over validity intervals (ADATU/BDATU) so an asset's organizational home can change over its life without rewriting ANLA. These allocation fields (KOSTL, PRCTR, SEGMENT, FKBER, GEBER) are exactly the account-assignment dimensions that ACDOCA carries on every line item, so a depreciation or acquisition posting must pick up the ANLZ record valid on the posting date — if ANLZ's validity-dated cost centre or profit centre doesn't match what actually posted to ACDOCA, asset postings land in the wrong CO/PC bucket even though the FI amounts tie out."
source: https://leanx.eu/en/sap/table/anlz.html
