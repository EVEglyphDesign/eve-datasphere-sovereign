table: ANLB
module: FI
description: "Depreciation Terms — depreciation-area-level control record for a fixed asset: depreciation key, useful life, start dates, and scrap value, one row per asset per depreciation area per validity period. Anchors to the ANLA asset master via BUKRS/ANLN1/ANLN2 and drives the depreciation postings that land in ACDOCA/ANEP; if the depreciation key or useful life here drifts from what last posted to ACDOCA, planned and posted depreciation diverge and the asset subledger no longer reconciles to the universal journal."
source: https://leanx.eu/en/sap/table/anlb.html
