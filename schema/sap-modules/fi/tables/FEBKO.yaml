table: FEBKO
module: FI
description: "Electronic Bank Statement Header Records — one row per imported electronic bank statement (house bank/account, statement number and date, opening/closing balances, total debits and credits), keyed by the surrogate KUKEY that its FEBEP line items reference. FEBKO is the cash-side counterpart to the asset subledger: the G/L account it posts against (HKONT) and the totals it carries (SSBTR/ESBTR/SUMSO/SUMHA) must equal what the statement's postings actually wrote to BSEG and, in S/4HANA, to ACDOCA for that bank G/L account — a statement whose header balances don't foot to the cleared items in FEBEP, or whose HKONT balance doesn't match the ACDOCA bank account balance, is exactly where cash-side reconciliation breaks."
source: https://leanx.eu/en/sap/table/febko.html
