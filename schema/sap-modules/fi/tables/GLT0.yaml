table: GLT0
module: FI
description: "G/L Account Master (Company Code) — Transaction Figures / classic G/L totals table. Carries one row per ledger/company code/account/period-set combination with a balance-carryforward bucket plus 16 debit and 16 credit period totals in local currency, transaction currency, and a second (hard/group) currency. This is the classic-GL (pre-New-GL) counterpart to FAGLFLEXT — an ECC customer still on classic G/L mirrors this table for account balances; a New-GL or S/4HANA customer's equivalent balance lives in FAGLFLEXT or is derived from ACDOCA."
source: https://leanx.eu/en/sap/table/glt0.html
