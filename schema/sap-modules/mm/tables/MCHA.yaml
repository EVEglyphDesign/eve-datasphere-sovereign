table: MCHA
module: MM
description: "Batches — the plant-specific batch master, one row per material per plant per batch, extending MCH1's cross-plant batch attributes with plant-level facts (valuation type via BWTAR) needed once a batch is stocked at a given plant. Sits between MCH1 (batch header) and MCHB (batch stock quantities by storage location) in the batch lane."
source: https://leanx.eu/en/sap/table/mcha.html
