table: EKBE
module: MM
description: "History per Purchasing Document — the PO-history table that records every goods-movement and invoice event against a purchase-order line, one row per PO item per account-assignment sequence per history-event type per material-document reference. This is the goods-receipt/invoice-receipt (GR/IR) tie-out table: the lane that reconciles what was ordered (EKPO), what was received (linked via GJAHR/BELNR/BUZEI back to the material document, MKPF/MSEG on ECC or MATDOC on S/4), and what was invoiced (REEWR/REFWR) against the GR/IR clearing account. SAP's real table carries 90+ fields including country/industry extensions (oil, CWM parallel units, depreciation completion); this definition is scoped to the full key, the GR/IR reconciliation fields (BEWTP, BWART, quantities, amounts, currencies), the material-document link fields, and the fields a crosswalk into ACDOCA would consume — no fewer than 25 fields, per the wide-table rule."
source: https://leanx.eu/en/sap/table/ekbe.html
