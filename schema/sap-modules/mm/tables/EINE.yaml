table: EINE
module: MM
description: "Purchasing Info Record: Purchasing Organization Data — the purchasing-organization-specific half of a purchasing info record, one row per info record per purchasing org per info-record category per plant, carrying the pricing and procurement conditions (net price, price unit, planned delivery time, over/underdelivery tolerances, incoterms, tax code, GR-based invoice-verification flag) that a sourcing or price-comparison lane consumes. Paired one-to-many back to EINA, which carries the organization-independent vendor/material facts; together they are the purchasing-info-record lane. SAP's real table carries additional country/industry-specific extension fields (Brazilian NCM, oil-industry excise-duty handling, transportation-chain staging); this definition is scoped to the core procurement-pricing fields plus the fields the model consumes."
source: https://leanx.eu/en/sap/table/eine.html
