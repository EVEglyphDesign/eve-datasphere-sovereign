table: MLGN
module: MM
description: "Material Data for Each Warehouse Number — the warehouse-level (WM) master data for a material, one row per material per warehouse number, carrying the storage-strategy defaults (put-away/picking storage-type indicators, loading-equipment quantities and units, storage-unit types, bulk-storage and 2-step-picking flags) that classic Warehouse Management uses to place and remove stock. Paired with MLGT for the storage-type-specific bin assignment; together they are the WM-material lane that sits alongside MARD's IM-level stock quantities."
source: https://leanx.eu/en/sap/table/mlgn.html
