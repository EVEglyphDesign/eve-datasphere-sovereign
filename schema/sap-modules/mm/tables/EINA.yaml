table: EINA
module: MM
description: "Purchasing Info Record: General Data — the client-wide, purchasing-organization-independent half of a purchasing info record, one row per info-record number, carrying the vendor/material pairing and general facts (vendor's material number, base unit of measure, reminder days, certificate of origin, regular-vendor flag) that hold true across every purchasing organization. Paired one-to-many with EINE, which carries the organization-specific pricing and conditions; together they form the purchasing-info-record lane a sourcing or vendor-evaluation lane consumes."
source: https://leanx.eu/en/sap/table/eina.html
