table: MCHB
module: MM
description: "Batch Stocks — the storage-location-level stock quantities for a batch, one row per material per plant per storage location per batch, mirroring MARD's stock-bucket structure (unrestricted, quality inspection, blocked, in-transfer, returns) but scoped down to a single batch. Completes the batch lane started by MCH1 (cross-plant batch header) and MCHA (plant-level batch); this is the table a batch-aware inventory query joins against for on-hand quantity."
source: https://leanx.eu/en/sap/table/mchb.html
