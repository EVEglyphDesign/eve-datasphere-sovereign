table: MARD
module: MM
description: "Storage Location Data for Material — carries stock quantities and physical-inventory status at the storage-location level, one row per material per plant per storage location, sitting directly beside the already-defined MARC (plant-level) data. Where MARC governs planning and procurement parameters for a material at a plant, MARD tracks the actual stock buckets (unrestricted, quality inspection, blocked, in-transfer, consignment) that a warehouse or inventory-management lane consumes for on-hand-quantity and physical-inventory reporting."
source: https://leanx.eu/en/sap/table/mard.html
