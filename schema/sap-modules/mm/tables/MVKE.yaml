table: MVKE
module: MM
description: "Sales Data for Material — the sales-organization/distribution-channel view of a material, one row per material per sales org per distribution channel, sitting alongside the plant-level MARC and storage-location MARD data already defined here. MVKE carries the commercial attributes (sales status, delivering plant, minimum order/delivery quantities, material pricing/rebate/commission groups, product hierarchy) that an order-to-cash or pricing lane consumes when a material is sold rather than merely stocked or procured."
source: https://leanx.eu/en/sap/table/mvke.html
