    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: MATNR
    description: "Material Number"
    data_element: MATNR
    check_table: MARA
    datatype: CHAR
    length: 18
    decimals: 0
    key: true
  - name: SPRAS
    description: "Language Key"
