table: MAKT
module: MM
description: "Material Descriptions — the language-dependent short-text description of a material, keyed by material number and language. Small text table joined onto MARA wherever a material-level line item needs a human-readable description."
source: https://leanx.eu/en/sap/table/makt.html
fields:
