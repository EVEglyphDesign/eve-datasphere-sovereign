    description: "Material Description (Short Text)"
    data_element: MAKTX
    check_table: ~
    datatype: CHAR
    length: 40
    decimals: 0
    key: false
  - name: MAKTG
    description: "Material description in upper case for matchcodes"
    data_element: MAKTG
    check_table: ~
    datatype: CHAR
    length: 40
    decimals: 0
    key: false
foreign_keys:
  - field: MANDT
    check_table: T000
    check_field: MANDT
  - field: MATNR
    check_table: MARA
