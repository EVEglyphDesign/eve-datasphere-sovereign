table: EKET
module: MM
description: "Scheduling Agreement Schedule Lines — the delivery-schedule detail beneath a PO/scheduling-agreement item, one row per PO item per schedule-line counter, carrying the promised delivery date, scheduled/received/issued quantities, and (for scheduling agreements specifically) the forecast-versus-JIT delivery mechanics that a supply-planning or on-time-delivery lane consumes. SAP's real table carries 75+ fields including SAP Global Trade Services routing, APO location, and open-to-buy (OTB) budget-check extensions; this definition is scoped to the full key, the core date/quantity schedule fields, the goods-movement linkage fields, and the requisition/reservation linkage fields — no fewer than 25 fields, per the wide-table rule."
source: https://leanx.eu/en/sap/table/eket.html
