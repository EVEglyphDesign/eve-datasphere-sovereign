table: EORD
module: MM
description: "Purchasing Source List — one row per material/plant source-of-supply record, defining which vendor, outline agreement, or issuing plant is the valid (and optionally fixed or blocked) source for procuring a material at a plant over a validity period. This is a small, complete customizing/master table carried in full."
source: https://leanx.eu/en/sap/table/eord.html
