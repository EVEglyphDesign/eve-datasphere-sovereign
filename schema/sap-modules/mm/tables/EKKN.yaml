table: EKKN
module: MM
description: "Account Assignment in Purchasing Document — one row per PO item per account-assignment sequence, carrying the cost object (G/L account, cost center, order, asset, WBS element, profit center, controlling area) that a purchase-order line is charged against. This is the table where a purchase line acquires its cost object and therefore its ACDOCA coordinates: SAKTO/KOSTL/AUFNR/ANLN1+ANLN2/PS_PSP_PNR/PRCTR here are the same dimensions the Universal Journal (ACDOCA) posts against once the invoice or goods receipt clears, making EKKN the crosswalk between procurement and the FI/CO lane. Parallels EBKN, the equivalent account-assignment table for purchase requisitions. SAP's real table also carries a handful of customer-namespace Z-fields (ZZREGION, ZZSPREG, ZZSTATE, ZZUSERFLD1) appended by implementation-specific extension — excluded here as non-standard; this definition is scoped to full key plus every standard-SAP account-assignment and cost-object field, no fewer than 25 fields, per the wide-table rule."
source: https://leanx.eu/en/sap/table/ekkn.html
