table: VBUP
module: SD
description: "Sales document item status — the item-level counterpart to VBUK, carrying per-item confirmation, delivery, goods-movement, billing, rejection, credit, picking, packing and incompletion status. NOTE ON RELEASE: VBUP is an ECC-era status table. In S/4HANA, SAP replaced VBUP (and its header-level counterpart VBUK) with status fields carried directly on VBAP (item) and VBAK (header) — VBUK/VBUP still exist as compatibility views/tables in S/4HANA for backward compatibility, but new status logic reads VBAP/VBAK directly. This model must read both releases: consult VBUP/VBUK for ECC systems and VBAP/VBAK status fields for S/4HANA systems. SAP's real table carries roughly 60 fields, most of them single-character status indicators (several industry-specific, e.g. OI/OIA Oil & Gas invoice cycles, MILL_VS steel); this definition is scoped to the key and the core cross-functional status fields (confirmation, delivery, goods movement, billing, rejection, overall processing, incompletion, credit) that the model consumes — never silently truncated below that scope."
source: https://leanx.eu/en/sap/table/vbup.html
