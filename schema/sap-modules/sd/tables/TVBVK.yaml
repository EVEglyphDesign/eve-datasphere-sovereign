    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: VKBUR
    description: "Sales Office"
    data_element: VKBUR
    check_table: TVBUR
    datatype: CHAR
    length: 4
    decimals: 0
    key: true
  - name: VKGRP
    description: "Sales Group"
    data_element: VKGRP
    check_table: TVKGR
    datatype: CHAR
    length: 3
    decimals: 0
    key: true
foreign_keys:
  - field: MANDT
    check_table: T000
    check_field: MANDT
  - field: VKBUR
    check_table: TVBUR
    check_field: VKBUR
  - field: VKGRP
    check_table: TVKGR
    check_field: VKGRP

