table: TVBVK
module: SD
description: "Organizational check table: sales groups per sales office — validates which sales groups (VKGRP) are permitted under a given sales office (VKBUR), the assignment that document fields VKBUR/VKGRP on VBAK are checked against. Carried complete as a small organizational customizing table."
source: https://leanx.eu/en/sap/table/tvbvk.html
fields:
