table: A004
module: SD
description: "Condition access table for material pricing — one of the standard SD pricing-procedure access sequence tables, keyed on sales organization, distribution channel and material, resolving to the KNUMH condition record number that joins into KONH/KONP to fetch the actual rate. Shows how a price is found: the pricing procedure walks an access sequence of tables like A004 in priority order until a valid, date-effective condition record is located."
source: https://leanx.eu/en/sap/table/a004.html
