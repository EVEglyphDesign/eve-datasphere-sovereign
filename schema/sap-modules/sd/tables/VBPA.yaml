table: VBPA
module: SD
description: "Sales document partner — the partner-function table that answers who the sold-to, ship-to, payer, and bill-to actually were on a given sales document (header, POSNR = '000000') or item, each row keyed by PARVW (partner function, e.g. AG sold-to, WE ship-to, RE bill-to, RG payer) and resolving to a customer (KUNNR) or vendor (LIFNR)."
source: https://leanx.eu/en/sap/table/vbpa.html
