table: TVKO
module: SD
description: "Organizational check table: sales organizations — the master list of sales organizations that every SD document's VKORG field validates against, carrying the sales org's company code assignment, statistics currency, address, and default purchasing/plant/storage-location references for intercompany processing. Carried complete as a small organizational customizing table."
source: https://leanx.eu/en/sap/table/tvko.html
