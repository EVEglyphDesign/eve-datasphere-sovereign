table: VBKD
module: SD
description: "Sales document business data — header- and item-level commercial terms (price group, Incoterms, payment terms, exchange rates for pricing, billing plan reference, customer PO reference) that condition the pricing and billing of a sales document. Can occur once per document (header, POSNR = '000000') or per item where item-specific business data overrides the header. SAP's real table carries roughly 130 fields, many industry-specific (IS-OIL, tax, SEPA); this definition is scoped to the key, pricing/currency, payment, and reference fields the SD pricing and billing model consumes — never silently truncated below that scope."
source: https://leanx.eu/en/sap/table/vbkd.html
