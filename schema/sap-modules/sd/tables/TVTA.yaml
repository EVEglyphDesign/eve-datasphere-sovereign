table: TVTA
module: SD
description: "Organizational check table: sales area assignments — validates the combination of sales organization, distribution channel and division (VKORG/VTWEG/SPART) that defines a sales area, the fundamental organizational unit every SD sales document is assigned to, and carries the business area, credit control area, and reference-division/channel rules that flow down onto documents in that sales area. Carried complete as a small organizational customizing table."
source: https://leanx.eu/en/sap/table/tvta.html
