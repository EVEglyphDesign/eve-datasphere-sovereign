table: KONP
module: SD
description: "Condition item — the pricing master record rate/value line under KONH, holding the actual amount, percentage, or scale that a condition record resolves to. Condition-access tables (e.g. A004) point to KNUMH, which joins KONH (header) to KONP (item, keyed additionally by KOPOS) to retrieve the rate applied when KONV builds the transaction-level pricing snapshot on a sales document. SAP's real table carries roughly 90 fields (including several industry-specific IS-OIL fields); this definition is scoped to the key, calculation/scale, currency, quantity, account/partner, and validity fields the pricing engine and any pricing crosswalk consume — never silently truncated below that scope."
source: https://leanx.eu/en/sap/table/konp.html
