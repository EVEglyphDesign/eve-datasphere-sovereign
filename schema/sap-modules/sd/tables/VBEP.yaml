table: VBEP
module: SD
description: "Sales document schedule line data — one or more delivery schedule lines per sales document item, each carrying requested/confirmed quantities and the delivery, material availability, transportation, loading and goods-issue dates the shipping and MRP processes plan against. Sits below VBAP in the SD document hierarchy (VBAK header / VBAP item / VBEP schedule line)."
source: https://leanx.eu/en/sap/table/vbep.html
