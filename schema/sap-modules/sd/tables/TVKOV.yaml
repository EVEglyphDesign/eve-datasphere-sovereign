    datatype: CHAR
    length: 4
    decimals: 0
    key: false
  - name: VLTYP
    description: "Distribution chain category"
    data_element: VLTYP
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
  - name: VLKEB
    description: "Allowed pricing levels below distribution chain level"
    data_element: VLKEB
    check_table: ~
    datatype: CHAR
    length: 1
    decimals: 0
    key: false
