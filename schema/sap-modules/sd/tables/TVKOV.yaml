table: TVKOV
module: SD
description: "Organizational check table: distribution channels per sales organization — validates the VKORG/VTWEG combination every SD document's distribution channel field must resolve to, and carries reference distribution channels used to share condition records, sales document types, and customer/material master data across channels. Carried complete as a small organizational customizing table."
source: https://leanx.eu/en/sap/table/tvkov.html
fields:
  - name: MANDT
    description: "Client"
    data_element: MANDT
    check_table: T000
    datatype: CLNT
    length: 3
    decimals: 0
    key: true
  - name: VKORG
    description: "Sales Organization"
    data_element: VKORG
    check_table: TVKO
    datatype: CHAR
    length: 4
    decimals: 0
    key: true
  - name: VTWEG
    description: "Distribution Channel"
    data_element: VTWEG
    check_table: TVTW
    datatype: CHAR
    length: 2
    decimals: 0
    key: true
  - name: VTWKO
    description: "Reference distribution channel for conditions"
    data_element: VTWKO
    check_table: TVTW
    datatype: CHAR
    length: 2
    decimals: 0
    key: false
  - name: VTWAU
    description: "Distribution channel for sales doc types"
    data_element: VTWAU
    check_table: TVTW
    datatype: CHAR
    length: 2
    decimals: 0
    key: false
  - name: VTWKU
    description: "Reference distrib.channel for cust.and material masters"
    data_element: VTWKU
    check_table: TVTW
    datatype: CHAR
    length: 2
    decimals: 0
