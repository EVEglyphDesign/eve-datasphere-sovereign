table: VBUK
module: SD
description: "Sales document header status and administrative data — the overall header-level status of a sales document across confirmation, delivery, goods movement, billing, credit checks, picking, packing, and rejection. NOTE ON RELEASE: VBUK is an ECC-era status table. In S/4HANA, SAP replaced VBUK (and its item-level counterpart VBUP) with status fields carried directly on VBAK (header) and VBAP (item) — VBUK/VBUP still exist as compatibility views/tables in S/4HANA for backward compatibility, but new status logic reads VBAK/VBAP directly. This model must read both releases: consult VBUK/VBUP for ECC systems and VBAK/VBAP status fields for S/4HANA systems. SAP's real table carries roughly 95 fields, most of them single-character status indicators (many industry-specific, e.g. OI_/OIC_ Oil & Gas, SPE_/HDALL WM); this definition is scoped to the key and the core cross-functional status fields (confirmation, delivery, goods movement, billing, credit, rejection, overall processing, incompletion) that the model consumes — never silently truncated below that scope."
source: https://leanx.eu/en/sap/table/vbuk.html
