table: KONH
module: SD
description: "Condition header — the pricing master record header behind every condition record (rebate agreement, price list, promotion). Grouped with KONP (condition items/rates) as the master-data pair that condition-access tables such as A004 point to via KNUMH; document-level pricing captured in KONV during order/delivery/billing processing is a runtime snapshot of what KONH/KONP defined at the time of pricing."
source: https://leanx.eu/en/sap/table/konh.html
