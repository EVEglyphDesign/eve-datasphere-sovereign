table: QMUR
module: PM
description: "Quality notification - causes — the failure-cause record any reliability analysis depends on. Ties a cause (URNUM) to a specific defect item (FENUM) on a notification (QMNUM), carrying the cause catalog code/group/coding, the responsible party (PARVW/PARNR), the affected assembly (BAUTL), and the quantity/percentage of the defect attributable to this cause (URMENGE/INVOLVPERC). Small, complete table."
source: https://leanx.eu/en/sap/table/qmur.html
