table: MCIPMIS
module: PM
description: "PMIS: Master data characteristics for PMIS before image — the PM information-structure statistics table that snapshots equipment/functional-location master-data characteristics (type, manufacturer, serial number, install date, organizational assignment) at statistics-update time, feeding LIS/PMIS reporting on the object population before a change. Small, complete table."
source: https://leanx.eu/en/sap/table/mcipmis.html
