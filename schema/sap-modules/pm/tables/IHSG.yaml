table: IHSG
module: PM
description: "Object-Related Permits in Plant Maintenance — assigns a permit type (PMSOG) to a technical object (equipment, functional location, order, or operation) with print/deletion control flags and the object-class discriminator, gating whether maintenance work on that object may proceed. Pairs with IHGNS which carries the permit's authorization workflow detail. Small, complete table."
source: https://leanx.eu/en/sap/table/ihsg.html
