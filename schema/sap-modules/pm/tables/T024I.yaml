table: T024I
module: PM
description: "Maintenance Planner Groups — customizing table defining the planner groups (INGRP) that own and schedule maintenance work at a given maintenance planning plant (IWERK). Every PM master and transactional record that assigns responsibility for planning a technical object or order checks against this table: EQUZ-INGRP (equipment time-segment planner group), IFLOT-INGRP (functional location planner group), and AFIH-INGPR (maintenance order header planner group) all validate here. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t024i.html
