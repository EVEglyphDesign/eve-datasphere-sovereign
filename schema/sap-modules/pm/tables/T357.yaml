table: T357
module: PM
description: "Plant Section — customizing table listing the plant sections (organizational subdivisions of a plant, e.g. a workshop or production line) valid per plant (WERKS), each with a responsible person and phone number. Referenced by ILOA-BEBER (Plant Section) — the address/location segment shared by every equipment, functional location and order — meaning any technical object's plant-section assignment validates against this table. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t357.html
