table: MHIO
module: PM
description: "Call Object from Maintenance Order — the maintenance-plan call object created when a maintenance plan (MPLA) schedules and triggers an order, notification, or inspection lot. This is the scheduled-maintenance record's execution link: it ties a plan cycle (WARPL+ABNUM+WPPOS) to the concrete order (AUFNR), notification (QMNUM), or inspection lot it generated, with the scheduled call date (GSTRP) and enqueue/status flags. Small, complete table."
source: https://leanx.eu/en/sap/table/mhio.html
