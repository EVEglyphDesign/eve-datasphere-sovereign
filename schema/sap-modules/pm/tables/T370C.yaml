table: T370C
module: PM
description: "ABC Indicator for Technical Objects — customizing table listing the valid ABC classification codes (criticality/priority ranking, e.g. A/B/C) assignable to a technical object. Referenced by ABCKZ on ILOA (the address/location segment shared by equipment, functional locations and orders), which flags the criticality of the object attached to that location record. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t370c.html
