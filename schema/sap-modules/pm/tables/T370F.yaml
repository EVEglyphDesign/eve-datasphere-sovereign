table: T370F
module: PM
description: "Functional Location Category — customizing table defining functional location categories, each carrying its status profile, partner determination procedure, measuring-point category and field-selection/view-profile linkage that governs which screens and fields are active for a functional location of that category. Referenced by FLTYP on IFLOT (Functional Location master), which determines the category of every functional location record. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t370f.html
