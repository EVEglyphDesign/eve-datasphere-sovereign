table: QMMA
module: PM
description: "Quality notification - activities — the tasks/activities recorded against a notification (and optionally a specific defect item, FENUM), carrying the activity's catalog code, classification, planned/actual start-finish dates, and completion flags. Tracks what corrective/follow-up action was taken on a notification. Small, complete table."
source: https://leanx.eu/en/sap/table/qmma.html
