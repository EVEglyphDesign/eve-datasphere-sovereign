table: T352B
module: PM
description: "Catalog Profile (maintenance-plan / notification catalog control) — customizing table controlling which catalogs (damage, cause, activity, task, object-part groupings) and notification category are active for a catalog profile. Referenced by RBNR on EQUZ (equipment time-segment catalog profile) and IFLOT (functional location catalog profile), which drive the coding catalogs available when recording findings against that technical object. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t352b.html
