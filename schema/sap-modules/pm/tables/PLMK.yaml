table: PLMK
module: PM
description: "Inspection plan characteristics — the quality/inspection characteristics assigned to a task-list operation (inspection points on a PM/QM task list node), carrying the master-inspection-characteristic reference, tolerance/target-value definition, sampling procedure, and long-text/short-text control. SAP's real table carries 140+ fields, including five repeating catalog-selection slots (KATAB1-5/KATALGART1-5/AUSWMENGE1-5/etc.) for multiple-choice valuation; this definition is scoped to the full key, master-characteristic linkage (QPMK_REF/VERWMERKM), value/tolerance/limit fields, sampling and formula fields, and status/validity fields a reliability or quality-inspection crosswalk consumes — never silently truncate beyond that scope."
source: https://leanx.eu/en/sap/table/plmk.html
