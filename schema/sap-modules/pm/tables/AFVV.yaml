table: AFVV
module: PM
description: "DB structure of the quantities/dates/values in the operation — one row per order operation (AUFPL/APLZL) carrying standard-value quantities, scheduled and actual execution/setup/teardown dates and times, work, and confirmation quantities that drive PM order operation costing and scheduling. SAP's real table carries 190+ fields (six parallel standard-value slots, forecast/business-process variants, and PS-specific date sets); this definition is scoped to the key, the unit-of-measure/base-quantity fields, the six standard-value pairs, confirmed/scrap/work quantities, and the earliest/latest/actual scheduling date-time fields a PM execution or crosswalk model consumes — never silently truncate beyond that scope."
source: https://leanx.eu/en/sap/table/afvv.html
