table: IHGNS
module: PM
description: "Permit Segment for Plant Maintenance — the approval/authorization workflow segment attached to a permit (via OBJNR+COUNTER), recording who requested, granted, and confirmed the safety permit and the associated valid-from/valid-to and confirmation timestamps. Works alongside IHSG (the object-related permit assignment) to drive the PM permit/safety-clearance process before maintenance work starts. Small, complete table."
source: https://leanx.eu/en/sap/table/ihgns.html
