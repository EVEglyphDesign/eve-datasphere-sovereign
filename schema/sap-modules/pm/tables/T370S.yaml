table: T370S
module: PM
description: "Functional Location Structure Indicators — customizing table defining the structure indicators that govern the edit mask and hierarchy-level syntax used to build functional location identifiers. Referenced by TPLKZ on IFLOT (Functional Location master), which determines how that functional location's hierarchical label is parsed and displayed. Carried complete — small customizing table."
