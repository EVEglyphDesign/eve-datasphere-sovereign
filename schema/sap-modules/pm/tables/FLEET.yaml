table: FLEET
module: PM
description: "Fleet Attributes — the vehicle master extension to the general equipment/object master (keyed on OBJNR), carrying VIN/chassis number, licence plate and its expiry, dimensions, engine and fuel type, odometer/hour-meter replacement readings, load capacity, and speed limits. This is the table a logistics or dealer digital twin keys on: it is the only PM table that carries licence-plate, VIN-equivalent (FLEET_VIN/CHASSIS_NUM), fuel-type, and odometer (REPLA_ODOM) fields, making it the natural join point between a maintenance-order/equipment record and an external vehicle/telematics or dealer system."
source: https://leanx.eu/en/sap/table/fleet.html
