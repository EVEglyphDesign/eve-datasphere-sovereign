table: VIQMEL
module: PM
description: "Generated Table for View — the notification view joining the QMEL notification header with equipment, functional-location, order, maintenance-plan, and organizational master data. This is the notification-reporting surface that any reliability, breakdown, or maintenance-KPI analysis reads from, since it flattens the object hierarchy (equipment/functional-location/order) onto the notification record. SAP's real view carries 250+ fields (it re-exposes most of the QMEL header plus joined reference fields from EQUI/IFLOT/AUFK/MPLA/organizational tables); this definition is scoped to the full key, notification classification and priority fields, all scheduling/reported dates, the equipment/functional-location/order/plan linkage fields, and the core organizational fields a crosswalk or failure-cause analysis (QMMA/QMUR) depends on — never silently truncate beyond that scope."
source: https://leanx.eu/en/sap/table/viqmel.html
