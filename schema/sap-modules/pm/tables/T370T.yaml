table: T370T
module: PM
description: "Equipment Categories — customizing table defining SAP's core equipment categories (e.g. machine, production resource/tool, customer equipment, fleet object) and every control switch that flows from that category: number-range assignment, multi-lingual text maintenance, status profile, partner determination, serialization, configuration and asset relevance. Referenced by EQTYP on EQUI (Equipment master), which fixes the category of every equipment record and, through this table, the entire behavior of that equipment. Carried complete — small customizing table."
source: https://leanx.eu/en/sap/table/t370t.html
