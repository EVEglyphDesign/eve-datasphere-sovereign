table: EQBS
module: PM
description: "Serial Number Stock Segment — the inventory-management stock segment (plant, storage location, batch, special-stock indicator) attached to a serialized equipment master (EQUI), linking a piece of serial-managed equipment to its MM stock position. Small, complete table."
source: https://leanx.eu/en/sap/table/eqbs.html
