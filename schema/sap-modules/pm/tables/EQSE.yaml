table: EQSE
module: PM
description: "Serial Number Records — the serial-number history/master table linking a material's serial number (MATNR+SERNR) to the equipment master it generated (EQUNR), including creation/change audit fields, plant/storage location/batch/customer context at the time of serialization, and a self-referencing history pointer (HEQSNR) to prior serial-number records. Small, complete table."
source: https://leanx.eu/en/sap/table/eqse.html
