table: MHIS
module: PM
description: "Maintenance plan history — the scheduling-cycle history record for a maintenance plan (WARPL), carrying each cycle's planned/actual call dates, tolerance and shift parameters, completion and confirmation timestamps, and (for time-based/strategy plans) the cycle sequence and offset-based scheduling parameters. Every call MHIO produces has one MHIS history row recording how and when the cycle counter advanced. SAP's real table carries fields beyond the core scheduling set (extended AD*/ADEXT*/ADSYS* offset-scheduling fields); this definition carries the full key, all core cycle/date/tolerance fields, and the extended AD*-prefixed offset-scheduling fields together — no truncation applied since the fetched field count fits within a complete definition."
source: https://leanx.eu/en/sap/table/mhis.html
