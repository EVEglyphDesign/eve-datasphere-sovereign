table: TKA01
module: CO
description: "Controlling Areas — the organizational root every CO object and every ACDOCA line's KOKRS field checks against; defines the operating currency, chart of accounts, fiscal year variant, and operating concern that govern the entire controlling area. SAP's real table carries roughly 50 fields; this definition carries the full functional field set that the model and a controlling-area crosswalk actually consume."
source: https://leanx.eu/en/sap/table/tka01.html
