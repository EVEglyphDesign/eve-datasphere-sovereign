table: AUFK
module: CO
description: "Order master data — the header record shared by every SAP order type (internal order, maintenance order, service order, WBS-linked order): order number, order type, controlling area, responsible/settlement cost center, status, and settlement cost element. This is the SAP analogue the CDK repair order keys on directly (AUFK-AUFNR)."
source: https://leanx.eu/en/sap/table/aufk.html
