table: MDVM
module: PP
description: "Planning File Entry — flags a material/plant (or other planning object) as due for the next MRP run, carrying net-change and low-level-code re-explosion indicators plus MRP timestamps. The demand-side trigger record of what the system has decided still needs re-planning."
source: https://leanx.eu/en/sap/table/mdvm.html
