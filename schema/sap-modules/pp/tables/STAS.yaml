table: STAS
module: PP
description: "BOM Item Selection — the selection/validity layer for a BOM item node (STLTY/STLNR/STLAL/STLKN), carrying valid-from date, technical status, change number, and date-shift history. The BOM item selection table beside the already-defined MAST (material-to-BOM link), STKO (BOM header), and STPO (BOM item)."
source: https://leanx.eu/en/sap/table/stas.html
