table: MAPL
module: PP
description: "Assignment of Task Lists to Materials — links a material/plant to a task list group, group counter, and additional-criteria counter. Anchors which routing(s) a material can be produced against; consumed alongside PLKO/PLPO for routing resolution."
source: https://leanx.eu/en/sap/table/mapl.html
