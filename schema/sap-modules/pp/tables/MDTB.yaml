table: MDTB
module: PP
description: "MRP Table Items — line items of an MRP list (MDKP header), one row per MRP element (planned order, purchase requisition, sales order, stock, etc.) with dates, quantities, and exception-message keys. The demand-side item record of what the system decided to make or buy. Wide table — carries the full field set as published by the source (60 fields), including all date/quantity/source-reference fields; no truncation applied."
source: https://leanx.eu/en/sap/table/mdtb.html
