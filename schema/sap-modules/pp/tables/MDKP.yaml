table: MDKP
module: PP
description: "MRP List Header — one row per material/plant/planning-scenario MRP list run (MRP date, exception-group selection indicators, MRP-relevant master data snapshot: MRP type, controller, lot-sizing, safety stock, discontinuation). The demand-side header record of what the system decided to make or buy; MDTB carries its line items. Wide table — carries the full field set as published by the source (91 fields), including all exception-group indicators, lot-size/safety-stock parameters, and message fields; no truncation applied."
source: https://leanx.eu/en/sap/table/mdkp.html
