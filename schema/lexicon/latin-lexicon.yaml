# Canonical Latin concept lexicon — EgD-LATIN-001
# © 2026 Dany Thériault / EVE Glyph Design. Pour le bien-être du peuple.
lexicon_id: EgD-LATIN-001
purpose: 'Concept lexicon for the canonical Latin naming layer. SAP field names are abbreviations of German
  words — BUKRS from Buchungskreis, WERKS from Werk, KOSTL from Kostenstelle. That is a source-language
  accident, not a design. The blueprint extracted from this wireframe carries a language-neutral Latin
  root vocabulary instead, so that a reader in any country resolves a field to a concept rather than to
  somebody else''s mother tongue. The legacy SAP name is never discarded: it is the mirror''s join key
  and is always shown on hover.'
rule: A canonical name is composed of up to three concept abbreviations, longest phrase matched first,
  in the order the concepts appear in the field's own description. Collisions inside a table are resolved
  with a numeric suffix. A field whose description matches no concept keeps its legacy name and is reported
  as underived rather than given an invented Latin form.
