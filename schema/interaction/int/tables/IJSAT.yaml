table: IJSAT
module: INT
description: Satellite and remote-link extension of the interaction journal. An interaction carried over
  a satellite terminal has properties no terrestrial channel has — a pass window, an elevation angle,
  a beam, a link budget — and they decide whether the interaction could happen at all. Recorded so that
  service to remote and underserved places can be measured honestly rather than averaged away against
  urban traffic.
source: EVEglyphDesign canonical structure. Shapes follow standard satellite ground-segment session practice;
  not a vendor table.
