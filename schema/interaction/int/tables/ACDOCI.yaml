table: ACDOCI
module: INT
description: 'Universal Interaction Journal. The same idea as ACDOCA, applied to human interaction: one
  line per interaction, carrying every dimension that interaction belongs to, whatever system of record
  it originated in. A case in Salesforce, an incident in ServiceNow, a phone call, a satellite session
  and a visit in a parish hall all land as the same shape of row. The source record is never altered and
  never replaced — SRCSYS, SRCTYP and SRCID always point back to it. Carries the ACDOCA cost-object spine
  so an interaction can be tied to the money it caused and to the societal effect it produced.'
source: EVEglyphDesign canonical structure. Not a vendor table. Mirrors Salesforce and ServiceNow systems
  of record; extensible to telephony and satellite via IJTEL and IJSAT.
