table: PARTY
module: INT
description: Party registry. Pseudonymous keys for the humans and organisations on either side of an interaction.
  The registry holds the key, the role, the member it belongs to and the consent governing it — the identifying
  detail stays in the system of record that is already lawfully holding it. A model that copies everyone's
  name into a second database has not improved anybody's position.
source: EVEglyphDesign canonical structure. Pseudonymisation is a design requirement, not a setting.
