table: STSMAP
module: INT
description: Status crosswalk. Salesforce case statuses, ServiceNow incident states, telephony dispositions
  and a parish register's own words all resolve to one canonical status set, while the source value stays
  on the interaction line untouched. Normalisation that destroys the original is not normalisation, it
  is loss.
