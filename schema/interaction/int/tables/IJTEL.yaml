table: IJTEL
module: INT
description: 'Telephony extension of the interaction journal. Keyed on the interaction line, so a voice
  interaction carries its call detail without every other channel inheriting empty columns. Numbers are
  held as salted hashes, never in the clear: a call record is personal data and the mirror is not a wiretap.'
source: EVEglyphDesign canonical structure. Shapes follow standard call-detail and SIP session practice;
  not a vendor table.
