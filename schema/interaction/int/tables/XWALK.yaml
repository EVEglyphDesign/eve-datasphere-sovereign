table: XWALK
module: INT
description: Field crosswalk registry. The combined schema is not achieved by forcing Salesforce and ServiceNow
  to agree; it is achieved by recording, field by field, how each one maps onto the canonical interaction
  line. Every mapping declares its transform and its confidence, and an unmapped source field is recorded
  as unmapped rather than quietly dropped. This table is what makes a third system — a phone platform,
  a satellite ground segment, a parish register — a configuration exercise instead of a rewrite.
source: EVEglyphDesign canonical structure. Populated per source system; the mappings are the deliverable.
