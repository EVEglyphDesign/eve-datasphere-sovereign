table: SYSRC
module: INT
description: 'System of record registry. Every source the interaction journal mirrors from: a Salesforce
  org, a ServiceNow instance, a telephony platform, a satellite ground segment, a parish register. Records
  what is read, under whose authority, how often, and on what legal basis — because a mirror without a
  declared basis is surveillance.'
source: EVEglyphDesign canonical structure. The register itself is the governance artifact.
