table: ITYP
module: INT
description: 'Interaction type master. What kind of human interaction the line records: a case, an incident,
  a call, a meeting, a task, a service request, a home visit, a sacrament, a class taught. The list is
  deliberately not limited to commercial support work, because the ledger is meant to cover all forms
  of human interaction, not only the ones that bill.'
